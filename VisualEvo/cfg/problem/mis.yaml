func_name: draw
description: |
 I need assistance in designing a new image-rendering function that visualizes Maximum Independent Set (MIS) instances for consumption by a Vision-Language Model (VLM). The function takes a graph (nodes and edges) and must render it as a single image that a VLM can look at and then predict a maximum independent set. The rendered images are used to build a training dataset: a base VLM is fine-tuned (LoRA SFT) on a set of these rendered images paired with instructions, and the resulting fine-tuned model's ability to solve held-out MIS instances purely from images is the ultimate measure of how good the rendering function is. A good rendering function must make node positions and edge connections clearly and unambiguously readable, since any information the VLM cannot read from the image cannot be used to produce a correct solution. The objective is to maximize the size of independent sets found by the fine-tuned VLM on a held-out evaluation set of MIS instances rendered with the same function.
pro: Maximum Independent Set (MIS) 
alg: Vision-Language Model (VLM) SFT-based Neural Combinatorial Optimization
