func_name: draw
description: |
 I need assistance in designing a new image-rendering function that visualizes Traveling Salesman Problem (TSP) instances for consumption by a Vision-Language Model (VLM). The function takes a TSP instance (city coordinates) and must render it as a single image that a VLM can look at and then predict a good tour. The rendered images are used to build a training dataset: a base VLM is fine-tuned (LoRA SFT) on a set of these rendered images paired with instructions, and the resulting fine-tuned model's ability to solve held-out TSP instances purely from images is the ultimate measure of how good the rendering function is. A good rendering function must make node positions clearly and unambiguously readable, since any information the VLM cannot read from the image cannot be used to produce a correct solution. The objective is to minimize the tour length of the fine-tuned VLM's solutions on a held-out evaluation set of TSP instances rendered with the same function.
pro: Traveling Salesman Problem (TSP) 
alg: Vision-Language Model (VLM) SFT-based Neural Combinatorial Optimization
